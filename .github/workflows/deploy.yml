name: Docker Image Delivery

on:
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy to EC2 (SSH 접속 테스트)
        run: | 
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@43.200.3.226 "echo 'SSH 연결 성공!'"

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: image-tag
        run: echo "TAG=$(date +%s)-ci" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Decode Firebase credentials
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS }}" | base64 -d > ./src/main/resources/toucheese-mvp-firebase-adminsdk.json

      - name: Decode application-secret
        run: |
          echo "${{ secrets.APPLICATION_SECRET }}" | base64 -d > ./src/main/resources/application-secret.yml

      - name: Decode Apple Private Key
        run: |
          mkdir -p ./src/main/resources/key
          echo "${{ secrets.APPLE_PRIVATE_KEY }}" | base64 -d > ./src/main/resources/key/apple_private_key.pem

      - name: Build and Push the Docker image
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64 \
            --tag "toucheese/app:$TAG" --push .

      - name: Tag Image as latest
        run: |
          docker pull "toucheese/app:$TAG"
          docker tag "toucheese/app:$TAG" "toucheese/app:latest"
          docker push "toucheese/app:latest"

      - name: Determine Active Backend
        id: active-backend
        run: |
          ACTIVE_CONTAINER=$(ssh ubuntu@43.200.3.226 "docker ps --format '{{.Names}}' | grep app-blue || echo 'app-green'")
          if [ "$ACTIVE_CONTAINER" = "app-blue" ]; then
            echo "NEW_CONTAINER=app-green" >> "$GITHUB_ENV"
          else
            echo "NEW_CONTAINER=app-blue" >> "$GITHUB_ENV"
          fi

      - name: Deploy new container using Docker Compose
        run: |
          ssh ubuntu@43.200.3.226 << EOF
            cd ~/toucheese
            docker-compose pull $NEW_CONTAINER
            docker-compose up -d $NEW_CONTAINER
          EOF

      - name: Update Nginx Configuration and Reload
        run: |
          ssh ubuntu@43.200.3.226 << EOF
            sudo sed -i 's/server app-[a-z]*:8080;/server $NEW_CONTAINER:8080;/' /etc/nginx/nginx.conf
            sudo systemctl reload nginx
          EOF

      - name: Remove Old Container
        run: |
          ssh ubuntu@43.200.3.226 "docker-compose down $ACTIVE_CONTAINER"
