spring:
  profiles:
    active: prod
    include: secret
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      show-sql: true
      hibernate:
        format_sql: true
        # use_sql_comments: true
        highlight_sql: true
  servlet:
    multipart:
      max-file-size: 5MB # 한개 파일의 최대 사이즈 (default: 1MB)
      max-request-size: 25MB # 한개 요청의 최대 사이즈 (default: 10MB)

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    groups-order: DESC
    display-request-duration: true
